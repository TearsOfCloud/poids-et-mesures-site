
 <div class="wrap">
  <div class="list-head">
   <div><span class="mono c-gris">Tout ce qu'on a pesé</span><h1>Les <em>articles</em></h1></div>

  </div>
  <div class="list-tools">
   <div class="chips" role="group" aria-label="Filtrer par rubrique" id="aChips"></div>

  </div>
  <div class="grid-art" id="gridArt">{{grid_html}}</div>
  <p class="empty" id="empty" hidden>Rien trouvé. Essaie un autre mot, ou propose-nous le sujet sur Instagram.</p>
 </div>
